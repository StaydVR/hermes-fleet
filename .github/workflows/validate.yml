name: Validate fleet standards

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Validate repository
        run: python tools/validate_repo.py .
      - name: Run validator self-test
        run: python tools/validate_repo.py --self-test
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
