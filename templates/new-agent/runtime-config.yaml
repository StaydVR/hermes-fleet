# Start from the fleet Slack contract. Add only reviewed role-specific runtime settings.
agent:
  gateway_notify_interval: 0

display:
  interim_assistant_messages: false
  tool_progress: "off"
  thinking_progress: false
  live_status: "off"
  platforms:
    slack:
      interim_assistant_messages: false
      tool_progress: "off"
      thinking_progress: false
      streaming: false
      long_running_notifications: false
      busy_ack_detail: false
      live_status: verb

gateway:
  streaming:
    enabled: false
  platforms:
    slack:
      typing_indicator: true
      typing_status_text: "is thinking..."

platforms:
  slack:
    reply_to_mode: first
    extra:
      reply_in_thread: true
      reply_broadcast: false
      native_task_cards: false
      allow_bots: mentions

slack:
  require_mention: true
  strict_mention: true
  thread_require_mention: true
  ignore_other_user_mentions: true

model:
  default: <approved-model>
  provider: <approved-provider>
