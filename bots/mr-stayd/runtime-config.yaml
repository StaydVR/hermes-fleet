# Runtime hardening for Mr Stayd (live_profile: default).
# Model pin + hang-class stream idle timeouts (see don-draper 2026-08-20).

# Fleet-wide Slack exact-mention, working-status, and verified lifecycle behavior.
agent:
  gateway_notify_interval: 0

display:
  interim_assistant_messages: false
  tool_progress: "off"
  thinking_progress: false
  live_status: "off"
  platforms:
    slack:
      interim_assistant_messages: false
      tool_progress: "off"
      thinking_progress: false
      streaming: false
      long_running_notifications: false
      busy_ack_detail: false
      live_status: verb

gateway:
  streaming:
    enabled: false
  platforms:
    slack:
      typing_indicator: true
      typing_status_text: "is thinking..."

platforms:
  slack:
    reply_to_mode: first
    extra:
      reply_in_thread: true
      reply_broadcast: false
      native_task_cards: false
      allow_bots: mentions

slack:
  require_mention: true
  strict_mention: true
  thread_require_mention: true
  ignore_other_user_mentions: true

model:
  default: grok-4.6
  provider: xai-oauth

providers:
  xai-oauth:
    stale_timeout_seconds: 900
    models:
      "grok-4.6":
        stale_timeout_seconds: 900
      "grok-4.5":
        stale_timeout_seconds: 900

fallback_providers:
  - provider: nous
    model: hermes-4-70b

compression:
  enabled: true
  threshold: 0.35
  target_ratio: 0.25
  protect_last_n: 12
  protect_first_n: 3
  micro_compact: true
  proactive_prune_tokens: 60000
  idle_compact_after_seconds: 1800

session_reset:
  mode: idle
  idle_minutes: 720
  at_hour: 4
