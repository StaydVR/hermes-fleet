# Runtime hardening for Don (merged into live config.yaml by apply-bot.sh).
# 2026-08-20: huge-context grok stream idle kill + no provider failover.
# 2026-08-25: grok-4.5 HTTP 400 — xAI reserves function name tool_search;
#             fallback hermes-4-70b 404 on Nous inference. Pin grok-4.6
#             (same as Mr Stayd). Fallback uses OpenRouter catalog id.

# Fleet-wide Slack quiet-mode and verified lifecycle behavior.
agent:
  gateway_notify_interval: 0

display:
  interim_assistant_messages: false
  tool_progress: "off"
  thinking_progress: false
  live_status: "off"
  platforms:
    slack:
      interim_assistant_messages: false
      tool_progress: "off"
      thinking_progress: false
      streaming: false
      long_running_notifications: false
      busy_ack_detail: false
      live_status: "off"

gateway:
  streaming:
    enabled: false

platforms:
  slack:
    reply_to_mode: first
    extra:
      reply_in_thread: true
      reply_broadcast: false
      native_task_cards: false
      allow_bots: mentions

slack:
  require_mention: true
  strict_mention: false
  thread_require_mention: false
  ignore_other_user_mentions: true

model:
  default: grok-4.6
  provider: xai-oauth

providers:
  xai-oauth:
    stale_timeout_seconds: 900
    models:
      "grok-4.6":
        stale_timeout_seconds: 900
      "grok-4.5":
        stale_timeout_seconds: 900

fallback_providers:
  - provider: nous
    model: nousresearch/hermes-4-70b

compression:
  enabled: true
  threshold: 0.35
  target_ratio: 0.25
  protect_last_n: 12
  protect_first_n: 3
  micro_compact: true
  proactive_prune_tokens: 60000
  idle_compact_after_seconds: 1800

session_reset:
  mode: idle
  idle_minutes: 720
  at_hour: 4
