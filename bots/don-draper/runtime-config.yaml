# Runtime hardening for Don (merged into live config.yaml by apply-bot.sh).
# Prevents the 2026-08-20 failure mode: huge-context grok-4.5 stream idle
# kill + no provider failover.

providers:
  xai-oauth:
    stale_timeout_seconds: 900
    models:
      "grok-4.5":
        stale_timeout_seconds: 900

fallback_providers:
  - provider: nous
    model: hermes-4-70b

compression:
  enabled: true
  threshold: 0.35
  target_ratio: 0.25
  protect_last_n: 12
  protect_first_n: 3
  micro_compact: true
  proactive_prune_tokens: 60000
  idle_compact_after_seconds: 1800

session_reset:
  mode: idle
  idle_minutes: 720
  at_hour: 4
